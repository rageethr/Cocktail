<style>
/* Layout: one narrow column on kraft paper, the invite on top, the reply card below it, like a response card tucked behind the invitation */
:root{
  --kraft:#d9c4a3; --kraft-deep:#cdb592; --paper:#e6d6bc;
  --ink:#8e2a22; --ink-soft:#a5524a; --line:#b89f7c;
  --script:"Pinyon Script","Snell Roundhand","Edwardian Script ITC",cursive;
  --serif:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  color-scheme:light;
}
html{background:var(--kraft)}
body{background:var(--kraft);color:var(--ink);font-family:var(--serif);font-size:18px;line-height:1.5;padding:32px 16px 56px;
  background-image:radial-gradient(rgba(120,80,40,.07) 1px,transparent 1px);background-size:3px 3px}
.wrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.invite{display:block;width:100%;max-width:100%;border-radius:2px;box-shadow:0 1px 0 rgba(90,50,20,.15),0 18px 40px -18px rgba(90,50,20,.45)}
.card{background:var(--paper);padding:32px 26px 30px;border-radius:2px;box-shadow:0 18px 40px -20px rgba(90,50,20,.4);display:flex;flex-direction:column;gap:22px}
.head{text-align:center;display:flex;flex-direction:column;gap:2px}
.head h1{font-family:var(--script);font-weight:400;font-size:clamp(40px,10.5vw,54px);line-height:1.15;margin:0 0 4px;text-wrap:balance}
.head p{margin:0;font-style:italic;color:var(--ink-soft);font-size:17px}
.rule{height:1px;background:var(--line);border:0;margin:0}
label,.legend{display:block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;margin-bottom:8px}
fieldset{border:0;padding:0;margin:0}
.field{display:flex;flex-direction:column}
input[type=text],input[type=tel],textarea,select{font:inherit;font-size:19px;color:var(--ink);background:transparent;border:0;border-bottom:1px solid var(--line);padding:6px 2px;border-radius:0;width:100%}
textarea{resize:vertical;min-height:64px;border:1px solid var(--line);padding:10px}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--ink)}
::placeholder{color:#a88f73;font-style:italic}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice input{position:absolute;opacity:0;pointer-events:none}
.choice span{display:block;text-align:center;padding:12px 8px;border:1px solid var(--line);font-size:17px;cursor:pointer;transition:background .15s,color .15s}
.choice input:checked+span{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.choice input:focus-visible+span{outline:2px solid var(--ink);outline-offset:2px}
.count{display:flex;align-items:center;gap:14px}
.count button{width:40px;height:40px;border:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;font-size:22px;cursor:pointer}
.count output{font-size:24px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.send{font:inherit;font-size:18px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;background:var(--ink);color:var(--paper);border:0;padding:15px;cursor:pointer;width:100%}
.send:hover{background:#74211b}
.send:focus-visible,.count button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.err{color:var(--ink);font-style:italic;margin:0;font-size:16px}
.done{text-align:center;display:flex;flex-direction:column;gap:14px}
.done h2{font-family:var(--script);font-weight:400;font-size:46px;margin:0;line-height:1.15}
.done p{margin:0}
.msg{white-space:pre-wrap;text-align:left;border:1px dashed var(--line);padding:12px 14px;font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row a,.row button{flex:1 1 160px;text-align:center;text-decoration:none;font:inherit;font-size:15px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;padding:12px;border:1px solid var(--ink);color:var(--ink);background:transparent;cursor:pointer}
.row a.primary{background:var(--ink);color:var(--paper)}
.small{font-size:15px;color:var(--ink-soft);font-style:italic}
.foot{text-align:center;font-style:italic;color:var(--ink-soft);font-size:16px;margin:0}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

  <section class="card" id="card">
    <div class="head">
      <h1>Kindly reply</h1>
      <p>Monday, November 16 · 8 pm · Kaze Bar and Kitchen</p>
    </div>
    <hr class="rule">

    <form id="f" novalidate>
      <div style="display:flex;flex-direction:column;gap:24px">
        <div class="field">
          <label for="name">Your name</label>
          <input type="text" id="name" autocomplete="name" placeholder="Full name">
        </div>

        <fieldset>
          <div class="legend">Will you join us?</div>
          <div class="choices">
            <label class="choice" style="margin:0;letter-spacing:0;text-transform:none;font-weight:400"><input type="radio" name="att" id="att-yes" value="yes"><span>Joyfully accepts</span></label>
            <label class="choice" style="margin:0;letter-spacing:0;text-transform:none;font-weight:400"><input type="radio" name="att" id="att-no" value="no"><span>Regretfully declines</span></label>
          </div>
        </fieldset>

        <div class="field">
          <label for="note">A note for the couple</label>
          <textarea id="note" placeholder="Optional"></textarea>
        </div>

        <p class="err" id="err" hidden></p>
        <button class="send" type="submit">Send RSVP</button>
      </div>
    </form>

    <div class="done" id="done" hidden>
      <h2>Thank you</h2>
      <p>Tap below to send your reply to Madhuri on WhatsApp.</p>
      <div class="msg" id="msg"></div>
      <div class="row">
        <a class="primary" id="wa" href="#" target="_blank" rel="noopener">Send on WhatsApp</a>
        <button type="button" id="copy">Copy message</button>
      </div>
      <p class="small" id="copied" hidden>Copied. Paste it into a message to Madhuri.</p>
      <button type="button" class="small" id="back" style="background:none;border:0;cursor:pointer;text-decoration:underline;font:inherit;color:var(--ink-soft)">Edit my reply</button>
    </div>
  </section>

  <p class="foot">Rageeth &amp; Madhuri</p>

<script>
const WHATSAPP_NUMBER = "919620719616"; // country code + number, digits only, e.g. 919876543210
const $ = id => document.getElementById(id);
let text = "";
$("f").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("name").value.trim();
  const att = document.querySelector('input[name=att]:checked');
  if (!name) { showErr("Please add your name."); return; }
  if (!att) { showErr("Please choose whether you can make it."); return; }
  $("err").hidden = true;
  const yes = att.value === "yes";
  const note = $("note").value.trim();
  text = "RSVP: Cocktail Evening, Nov 16\n" +
    "Name: " + name + "\n" +
    (yes ? "Attending: Yes, I'll be there" : "Attending: No, can't make it") +
    (note ? "\nNote: " + note : "");
  $("msg").textContent = text;
  const base = WHATSAPP_NUMBER && !WHATSAPP_NUMBER.startsWith("__") ? "https://wa.me/" + WHATSAPP_NUMBER : "https://wa.me/";
  $("wa").href = base + "?text=" + encodeURIComponent(text);
  $("f").hidden = true; $("done").hidden = false; $("copied").hidden = true;
});
function showErr(m){ const el=$("err"); el.textContent=m; el.hidden=false; }
$("back").onclick = () => { $("done").hidden = true; $("f").hidden = false; };
$("copy").onclick = () => {
  const ok = () => { $("copied").hidden = false; };
  try {
    navigator.clipboard.writeText(text).then(ok, sel);
  } catch (_) { sel(); }
  function sel(){ const r=document.createRange(); r.selectNodeContents($("msg")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); ok(); }
};
</script>
